# The cache module's config schema. The file it governs is CONFIG/cache/config.toml;
# `moxi config cache` shows every key and `moxi config cache init` writes the file.

[claude.ttl_seconds]
type = "int"
default = 3600
doc = "Claude's cache lifetime in seconds, used only when no request read names the cache tier it wrote."
read = "use"

[lifetime]
type = "list"
default = []
doc = "Your own [[lifetime]] rows, in the shipped table's schema: each adds a Codex or OpenCode model the shipped table has no row for, with a source or a ruling; a row that overlaps another is refused."
read = "use"

[watch.tick]
type = "int"
default = 10
doc = "Seconds between the watcher's ticks. The watcher writes three ticks into every clock record as stale_after, and a record not rewritten within its stale_after shows dim, because the watcher has stopped. A change reaches every record within one tick."
read = "use"

[segment.warn_before]
type = "int"
default = 900
doc = "Seconds before a cache's expiry at which the status line segment turns from warm to near. The watcher writes it into every clock record as warn_before, so a change reaches every record within one tick."
read = "use"

[timer.subscriber]
type = "list"
default = []
doc = "Your own timer subscriptions, as [[timer.subscriber]] tables of name, at, until, every, requires_env and run (see `moxi cache timers`); run[0] is an absolute path to an executable file."
read = "use"
